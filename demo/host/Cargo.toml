[package]
name = "wasmtime_demo_host"
version = "0.1.0"
edition = "2021"

[dependencies]
wasmtime = "27"
wasmtime-wasi = { version = "27", features = ["sync"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
wat = "1"
cap-std = "3"
